<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Órbitas de Satélites</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {

            font-family: Arial, sans-serif;

            background:
                radial-gradient(circle at top, #1a237e, #050816 60%);

            color: white;

            overflow-x: hidden;

            min-height: 100vh;
        }

        header {

            padding: 30px;

            text-align: center;
        }

        header h1 {

            font-size: 50px;

            background: linear-gradient(to right, #7c4dff, #40c4ff);

            -webkit-background-clip: text;

            -webkit-text-fill-color: transparent;

            margin-bottom: 10px;
        }

        header p {

            color: #b0bec5;

            font-size: 18px;
        }

        .stats {

            display: flex;

            justify-content: center;

            flex-wrap: wrap;

            gap: 20px;

            margin: 30px;
        }

        .stat-box {

            width: 220px;

            background: rgba(255,255,255,0.08);

            border: 1px solid rgba(255,255,255,0.1);

            padding: 20px;

            border-radius: 20px;

            text-align: center;

            backdrop-filter: blur(10px);

            box-shadow: 0 0 20px rgba(124,77,255,0.2);
        }

        .stat-box h2 {

            color: #40c4ff;

            margin-bottom: 10px;
        }

        .stat-box p {

            font-size: 28px;

            font-weight: bold;
        }

        .satellite-grid {

            display: grid;

            grid-template-columns:
                repeat(auto-fit, minmax(320px, 1fr));

            gap: 25px;

            padding: 40px;
        }

        .card {

            position: relative;

            background: rgba(255,255,255,0.07);

            border-radius: 25px;

            padding: 25px;

            overflow: hidden;

            backdrop-filter: blur(12px);

            border: 1px solid rgba(255,255,255,0.1);

            transition: 0.4s;
        }

        .card:hover {

            transform:
                translateY(-10px)
                scale(1.02);

            box-shadow:
                0 0 30px rgba(64,196,255,0.4);
        }

        .card::before {

            content: "";

            position: absolute;

            width: 300px;
            height: 300px;

            background:
                radial-gradient(#7c4dff55, transparent);

            top: -150px;
            right: -150px;
        }

        .satellite-name {

            font-size: 28px;

            color: #82b1ff;

            margin-bottom: 20px;

            text-align: center;
        }

        .info {

            margin-bottom: 12px;

            font-size: 18px;
        }

        .label {

            color: #b388ff;

            font-weight: bold;
        }

        .status {

            margin-top: 20px;

            display: inline-block;

            padding: 10px 16px;

            border-radius: 14px;

            background:
                linear-gradient(to right,
                #7c4dff,
                #2979ff);

            font-weight: bold;
        }

        .orbit {

            width: 140px;
            height: 140px;

            border:
                2px solid rgba(255,255,255,0.15);

            border-radius: 50%;

            margin: 20px auto;

            position: relative;
        }

        .planet {

            width: 40px;
            height: 40px;

            background:
                linear-gradient(to bottom,
                #7c4dff,
                #40c4ff);

            border-radius: 50%;

            position: absolute;

            top: 50%;
            left: 50%;

            transform: translate(-50%, -50%);

            box-shadow:
                0 0 20px #40c4ff;
        }

        .satellite-dot {

            width: 14px;
            height: 14px;

            border-radius: 50%;

            position: absolute;

            top: 50%;
            left: 50%;

            transform-origin: center;
        }

        @keyframes orbit {

            from {

                transform:
                    rotate(0deg)
                    translateX(55px)
                    rotate(0deg);
            }

            to {

                transform:
                    rotate(360deg)
                    translateX(55px)
                    rotate(-360deg);
            }
        }

        footer {

            text-align: center;

            padding: 40px;

            color: #90a4ae;
        }

    </style>

</head>

<body>

    <header>

        <h1>🛰️ Órbitas de Satélites</h1>

        <p>Monitoramento Espacial em Tempo Real</p>

    </header>

    <section class="stats">

        <div class="stat-box">
            <h2>Satélites</h2>
            <p id="totalSatellites">0</p>
        </div>

        <div class="stat-box">
            <h2>Status</h2>
            <p>ONLINE</p>
        </div>

        <div class="stat-box">
            <h2>Atualização</h2>
            <p id="clock">--:--:--</p>
        </div>

    </section>

    <section
        class="satellite-grid"
        id="satellites">
    </section>

    <footer>

        Sistema Orbital • Dashboard Espacial
        Interativo feito por Patrícia Maximiano 🌹

    </footer>

    <script>

        const satellitesData = [

            {
                id: 1,
                name: "ISS",
                altitude: "408 km",
                speed: "28.000 km/h",
                status: "Ativo",
                orbitSpeed: 3,
                color: "#40c4ff"
            },

            {
                id: 2,
                name: "Hubble",
                altitude: "540 km",
                speed: "27.300 km/h",
                status: "Monitorando",
                orbitSpeed: 6,
                color: "#7c4dff"
            },

            {
                id: 3,
                name: "NOAA-20",
                altitude: "824 km",
                speed: "26.000 km/h",
                status: "Clima",
                orbitSpeed: 9,
                color: "#00e5ff"
            },

            {
                id: 4,
                name: "Starlink",
                altitude: "550 km",
                speed: "27.000 km/h",
                status: "Internet",
                orbitSpeed: 4,
                color: "#b388ff"
            }

        ];

        function updateClock() {

            const now = new Date();

            document.getElementById("clock")
                .innerText =
                now.toLocaleTimeString();
        }

        setInterval(updateClock, 1000);

        updateClock();

        function loadSatellites() {

            const container =
                document.getElementById("satellites");

            document.getElementById(
                "totalSatellites"
            ).innerText =
                satellitesData.length;

            satellitesData.forEach(satellite => {

                container.innerHTML += `

                    <div class="card">

                        <div class="orbit">

                            <div class="planet"></div>

                            <div
                                class="satellite-dot"

                                style="
                                    background:
                                    ${satellite.color};

                                    box-shadow:
                                    0 0 20px
                                    ${satellite.color};

                                    animation:
                                    orbit
                                    ${satellite.orbitSpeed}s
                                    linear infinite;
                                ">

                            </div>

                        </div>

                        <div class="satellite-name">
                            ${satellite.name}
                        </div>

                        <div class="info">

                            <span class="label">
                                ID:
                            </span>

                            ${satellite.id}

                        </div>

                        <div class="info">

                            <span class="label">
                                Altitude:
                            </span>

                            ${satellite.altitude}

                        </div>

                        <div class="info">

                            <span class="label">
                                Velocidade:
                            </span>

                            ${satellite.speed}

                        </div>

                        <div class="status">
                            ${satellite.status}
                        </div>

                    </div>

                `;
            });
        }

        loadSatellites();

    </script>

</body>

</html>
